<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Base circle -->
  <circle cx="100" cy="100" r="96" fill="#fdfaf6" stroke="#e7e1d8" stroke-width="1.5"/>

  <!-- Paint strokes arranged in a circle -->
  <!-- Green stroke - top left -->
  <ellipse cx="55" cy="55" rx="22" ry="9" fill="#22c55e" transform="rotate(-45 55 55)" opacity="0.9"/>
  <!-- Red stroke - top right -->
  <ellipse cx="145" cy="55" rx="22" ry="9" fill="#ef4444" transform="rotate(45 145 55)" opacity="0.9"/>
  <!-- Blue stroke - right -->
  <ellipse cx="158" cy="100" rx="22" ry="9" fill="#3b82f6" transform="rotate(0 158 100)" opacity="0.9"/>
  <!-- Orange stroke - bottom right -->
  <ellipse cx="145" cy="145" rx="22" ry="9" fill="#f97316" transform="rotate(-45 145 145)" opacity="0.9"/>
  <!-- Yellow stroke - bottom -->
  <ellipse cx="100" cy="158" rx="22" ry="9" fill="#eab308" transform="rotate(90 100 158)" opacity="0.9"/>
  <!-- Purple stroke - bottom left -->
  <ellipse cx="55" cy="145" rx="22" ry="9" fill="#7c3aed" transform="rotate(45 55 145)" opacity="0.9"/>
  <!-- Coral stroke - left -->
  <ellipse cx="42" cy="100" rx="22" ry="9" fill="#e85d3b" transform="rotate(0 42 100)" opacity="0.9"/>
  <!-- Teal stroke - top -->
  <ellipse cx="100" cy="42" rx="22" ry="9" fill="#0284c7" transform="rotate(90 100 42)" opacity="0.9"/>

  <!-- Center circle -->
  <circle cx="100" cy="100" r="32" fill="#fdfaf6"/>

  <!-- Center text -->
  <text x="100" y="96" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="600" fill="#1c1917">
    Pinceladas
  </text>
  <text x="100" y="111" text-anchor="middle" font-family="Georgia, serif" font-size="7.5" fill="#57534e">
    y algo más
  </text>
</svg>
